<mat-toolbar class="header">

  <div class="left">

    <div class="logo">
      <mat-icon>analytics</mat-icon>
    </div>

    <div class="title-section">

      <h2>Employee Activity Dashboard</h2>

      <span>Microsoft Graph Sign-in Analytics</span>

    </div>

  </div>

  <div class="right">

    <div class="updated">

      <mat-icon>schedule</mat-icon>

      <span>

        Updated {{ lastUpdated | date:'hh:mm a' }}

      </span>

    </div>

    <button
      mat-flat-button
      color="primary">

      <mat-icon>refresh</mat-icon>

      Refresh

    </button>

    <div class="divider"></div>

    <div class="user-profile">

      <div class="avatar">

        {{ userName.charAt(0) | uppercase }}

      </div>

      <div class="user-info">

        <strong>{{ userName }}</strong>

        <small>Microsoft Entra ID</small>

      </div>

    </div>

    <button
      mat-icon-button
      color="warn">

      <mat-icon>logout</mat-icon>

    </button>

  </div>

</mat-toolbar>
