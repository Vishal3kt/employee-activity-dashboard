<mat-toolbar class="header">
  <div class="left">
    <div class="logo">
      <mat-icon>analytics</mat-icon>
    </div>

    <div class="title-section">
      <h2>Employee Activity Dashboard</h2>
      <span>Microsoft Graph Sign-in Analytics</span>
    </div>
  </div>

  <div class="right">
    @if (showRefresh()) {
      <div class="updated" aria-live="polite">
        <mat-icon style="margin-top: 6px">schedule</mat-icon>
        <span [matTooltip]="lastUpdated() ? (lastUpdated() | date: 'EEEE d MMMM, h:mm:ss a') : ''">
          @if (refreshing()) {
            Updating…
          } @else if (lastUpdated()) {
            Updated {{ lastUpdated() | date: 'h:mm a' }}
          } @else {
            Loading…
          }
        </span>
      </div>

      <button mat-flat-button color="primary" [disabled]="refreshing()" (click)="onRefresh()">
        <mat-icon [class.spin]="refreshing()">refresh</mat-icon>
        {{ refreshing() ? 'Refreshing…' : 'Refresh' }}
      </button>
    }

    <!-- Profile menu -->
    <button
      type="button"
      class="user-profile"
      [matMenuTriggerFor]="profileMenu"
      aria-label="Account menu"
    >
      <div class="avatar">{{ initials() }}</div>

      <div class="user-info">
        <strong>{{ displayName() }}</strong>
        <small>Microsoft Entra ID</small>
      </div>

      <mat-icon class="chevron">expand_more</mat-icon>
    </button>

    <mat-menu #profileMenu="matMenu" xPosition="before">
      <div class="menu-header" (click)="$event.stopPropagation()">
        <div class="menu-avatar">{{ initials() }}</div>
        <div class="menu-identity">
          <strong>{{ displayName() }}</strong>
          <span>{{ email() }}</span>
        </div>
      </div>

      <mat-divider></mat-divider>

      <button mat-menu-item (click)="logout()" [disabled]="signingOut()">
        <mat-icon>logout</mat-icon>
        <span>{{ signingOut() ? 'Signing out…' : 'Sign out' }}</span>
      </button>
    </mat-menu>

    <button
      mat-icon-button
      color="warn"
      matTooltip="Sign out"
      aria-label="Sign out"
      [disabled]="signingOut()"
      (click)="logout()"
    >
      <mat-icon>logout</mat-icon>
    </button>
  </div>
</mat-toolbar>
